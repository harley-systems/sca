name: gh-hosted-probe
# Throwaway probe: can a GitHub-hosted runner do what make integration needs?
# Runs only on its own branch. Delete the branch and this file when answered.
on:
  push:
    branches: [test/gh-hosted-probe]

jobs:
  signing-key:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make check-ubuntu-key

  full-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: disk before
        run: df -h /
      - name: make integration (cold cache)
        run: make integration
      - name: disk after
        if: always()
        run: df -h /
