# Raspberry Pi 4 / 5 board profile -- a PROPOSAL, UNVERIFIED.
#
# Nobody has run any of this on a Raspberry Pi. It is written down to show that
# the profile keys can describe a board that reaches the same goal by different
# means, and must be checked on hardware before anyone relies on it.
#
# A profile is data, not code: it is read key by key and never sourced or
# evaluated. See src/appliance/boards/README.md for the keys.
name=Raspberry Pi 4 / 5 (unverified)
compatible=raspberrypi,(4|5)-model-b
verified=no
# enabling USB boot on a Pi 4/5 changes BOOT_ORDER in the SPI EEPROM, which can
# be changed back. A Pi 3 profile would be irreversible=yes: USB boot there
# burns a one-time-programmable bit.
irreversible=no

# used by 'sca appliance init' (not implemented yet); shown by 'sca appliance info'
base_image=Raspberry Pi OS Lite (arm64) (unverified)
base_image_check=sha256 published by raspberrypi.com (unverified)
boot_enable_method=eeprom_boot_order
rtc_method=config_txt_dtoverlay
# the same header pins 3 and 5 as i2c-0 on the ROCK64
i2c_bus=i2c-1

# used by 'sca appliance verify'
root_transports=usb
rtc_name=^rtc-ds1307( |$)
masked_units=fake-hwclock-load.service fake-hwclock-save.service fake-hwclock-save.timer
probe_label=boot
probe_command=vcgencmd bootloader_config
# BOOT_ORDER is read right to left, one boot mode per hex digit (1 = SD card,
# 4 = USB mass storage). USB comes before SD when no 1 is to the right of a 4:
# 0xf14 and 0xf4 pass, 0xf41 does not.
probe_expect=^BOOT_ORDER=0x[0-9a-fA-F]*4[02-9a-fA-F]*$
