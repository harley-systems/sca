# PINE64 ROCK64 (RK3328) platform profile.
#
# A profile is data, not code: it is read key by key and never sourced or
# evaluated. One key=value per line, '#' starts a comment line. See
# src/appliance/platforms/README.md for the keys.
#
# Verified on hardware on 2026-11-06 (#108, #132, #136): the DS3231 as rtc0
# through the overlay, fake-hwclock masked, and U-Boot booting from SPI flash
# (u-boot,version without the _armbian suffix). Booting the root file system
# from a USB stick is NOT verified yet.
name=PINE64 ROCK64
compatible=pine64,rock64
verified=2026-11-06 (#108 #132 #136): RTC, U-Boot from SPI; USB-stick root unverified
arch=arm64
irreversible=no

# used by 'sca appliance init' (not implemented yet); shown by 'sca appliance info'
base_image=Armbian (rock64)
base_image_check=sha256 and gpg signature published by Armbian
boot_prep=uboot-spi
rtc=i2c-ds3231
rtc_method=dt_overlay_aliases
i2c_bus=i2c-0

# used by 'sca appliance verify'
root_transports=usb
rtc_name=^rtc-ds1307( |$)
masked_units=fake-hwclock-load.service fake-hwclock-save.service fake-hwclock-save.timer
probe_label=boot
probe_file=/proc/device-tree/chosen/u-boot,version
# U-Boot from SPI reports a bare version (2026.04). The one on the Armbian
# microSD reports 2026.04_armbian-..., which means the boot ROM skipped SPI.
probe_expect=^[0-9]{4}\.[0-9]{2}
probe_reject=_armbian
