# x86 mini PC platform profile (amd64), e.g. an Intel NUC -- UNVERIFIED.
#
# This is the platform today's 'sca init sca_usb_stick' image already targets:
# an amd64 PC boots the Ubuntu live USB stick out of the box, so there is no
# boot preparation (boot_prep=none) and no board-specific boot probe. The
# battery-backed CMOS clock is built in, so none of the DS3231 work applies.
# Nobody has run 'sca appliance verify' on a mini PC yet.
#
# x86 has no device tree, so this profile has no 'compatible' key: it is
# detected as the one such profile whose arch is the machine's.
#
# A profile is data, not code: it is read key by key and never sourced or
# evaluated. See src/appliance/platforms/README.md for the keys.
name=x86 mini PC (amd64)
verified=no
arch=amd64
irreversible=no

# used by 'sca appliance init' (not implemented yet); shown by 'sca appliance info'
base_image=Ubuntu desktop live ISO (amd64), as built by 'sca init sca_usb_stick'
base_image_check=SHA256SUMS signed by the Ubuntu CD image key, checked with gpgv
boot_prep=none
rtc=builtin

# used by 'sca appliance verify'
root_transports=usb
rtc_name=^rtc_cmos( |$)
# Ubuntu does not ship fake-hwclock; an absent unit passes
masked_units=fake-hwclock-load.service fake-hwclock-save.service fake-hwclock-save.timer
